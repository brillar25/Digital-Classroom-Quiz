{% extends "base.html" %}
{% block title %}Edit Question{% endblock %}
{% block content %}
<section class="page-section"><div class="container"><div class="row justify-content-center"><div class="col-lg-8"><div class="app-card"><h1 class="page-heading">Edit Question</h1><p class="page-subtitle">Quiz: <strong>{{ question.quiz.title }}</strong></p><form method="POST"><label class="form-label">Question</label><textarea name="question" class="form-control mb-3" rows="3" required>{{ question.question }}</textarea><div class="row g-3">{% for n in range(1,5) %}<div class="col-md-6"><label class="form-label">Option {{ n }}</label><input name="option{{ n }}" value="{{ question['option' ~ n] }}" class="form-control" required></div>{% endfor %}</div><div class="mt-3 mb-4"><label class="form-label">Correct Answer</label><select name="correct_answer" class="form-select">{% for n in range(1,5) %}<option value="option{{ n }}" {% if question.correct_answer == 'option' ~ n %}selected{% endif %}>Option {{ n }}</option>{% endfor %}</select></div><button class="btn btn-green">Save Changes</button><a href="{{ url_for('add_question', quiz_id=question.quiz_id) }}" class="btn btn-outline-secondary ms-2">Cancel</a></form></div></div></div></div></section>
{% endblock %}
