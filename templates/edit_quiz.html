{% extends "base.html" %}
{% block title %}Edit Quiz{% endblock %}
{% block content %}
<section class="page-section"><div class="container"><div class="row justify-content-center"><div class="col-lg-6"><div class="app-card"><h1 class="page-heading">Edit Quiz</h1><p class="page-subtitle">Change the quiz title.</p><form method="POST"><label class="form-label">Quiz Title</label><input name="title" value="{{ quiz.title }}" class="form-control mb-3" required><button class="btn btn-purple">Save Changes</button><a href="{{ url_for('teacher') }}" class="btn btn-outline-secondary ms-2">Cancel</a></form></div></div></div></div></section>
{% endblock %}
